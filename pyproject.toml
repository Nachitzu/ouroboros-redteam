[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouroboros-redteam"
dynamic = ["version"]
description = "An AI agent that red-teams AI agents: prompt-injection auditing and auto-remediation for LLM-based systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nachitzu" }]
keywords = [
  "prompt-injection",
  "red-team",
  "llm-security",
  "mitre-atlas",
  "ai-security",
  "guardrails",
  "claude",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.7",
  "typer>=0.12",
  "GitPython>=3.1",
  "PyGithub>=2.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ouroboros = "ouroboros.cli:app"
ouroboros-tool = "ouroboros.toolcli:app"

[project.urls]
Repository = "https://github.com/Nachitzu/ouroboros-redteam"

[tool.hatch.version]
path = "src/ouroboros/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ouroboros"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "SIM108",  # ternary-vs-if is a readability call, not a defect
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["git.*", "github.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["ouroboros"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
